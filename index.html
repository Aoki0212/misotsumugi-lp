<style>
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  html,body { margin:0; padding:0; background:#000; -webkit-text-size-adjust:100%; }
  body.is-locked { overflow:hidden; }
  .wrap { max-width:430px; margin:0 auto; position:relative; background:#0d0703; }

  /* ===== FVアニメ（先頭・全画面） ===== */
  .fvstage { position:relative; width:100%; max-width:430px; margin:0 auto; height:100svh; background:#000; overflow:hidden; }

  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#000; overflow:hidden; }
  .stage { position:relative; width:100%; height:100%; max-width:750px; margin:0 auto; background:#000; overflow:hidden; }

  /* ===== FV（着地先）===== */
  .fv { position:absolute; inset:0; overflow-y:auto; opacity:0; transform:scale(1.05); }
  .fv img { display:block; width:100%; }
  .done .fv { opacity:1; transform:scale(1); transition:opacity .7s ease .1s, transform 1.1s ease .1s; }

  /* ===== オーバーレイ ===== */
  .ov { position:absolute; inset:0; background:#000; z-index:5; overflow:hidden; }
  .done .ov { opacity:0; visibility:hidden; transition:opacity .7s ease .25s, visibility 0s 1.1s; }

  /* --- 1. 白「味噌」着地（サインそのまま）--- */
  .kanji { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:.14em;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-weight:800;
    font-size:min(32vw,230px); line-height:1; color:#fff; z-index:8;
    transform:translateX(-4%); }
  .kanji span { opacity:0; transform:scale(2.4); filter:blur(10px); }
  .play .kanji span:nth-child(1) { animation:slam .42s cubic-bezier(.2,1.1,.35,1) .12s forwards; }
  .play .kanji span:nth-child(2) { animation:slam .42s cubic-bezier(.2,1.1,.35,1) .28s forwards; }
  @keyframes slam {
    0%   { opacity:0; transform:scale(2.4); filter:blur(10px); }
    60%  { opacity:1; filter:blur(0); }
    78%  { transform:scale(.96); }
    100% { opacity:1; transform:scale(1); filter:blur(0);
           text-shadow:0 0 34px rgba(255,255,255,.22); }
  }
  /* 着地の衝撃（画面全体が一瞬沈む） */
  .play .ov { animation:shake .3s linear .62s; }
  @keyframes shake {
    0%,100% { transform:translate(0,0); }
    25% { transform:translate(0,7px); }
    55% { transform:translate(0,-4px); }
    80% { transform:translate(0,2px); }
  }

  /* --- 2. 赤帯（店内の赤帯×縦書き店名）--- */
  .band { position:absolute; top:-110%; right:3%; width:min(14vw,88px); height:120%;
    background:linear-gradient(180deg,#a3131c,#7e0d15); z-index:7;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 34px rgba(163,19,28,.5); }
  .band p { writing-mode:vertical-rl; color:#fff; letter-spacing:.34em;
    font-family:"Hiragino Mincho ProN",serif; font-size:min(4vw,24px); white-space:nowrap; }
  .play .band { animation:banddrop .5s cubic-bezier(.3,.9,.3,1) .65s forwards; }
  @keyframes banddrop { to { top:-8%; } }

  .ring2 { --rot:130deg; } .ring3 { --rot:250deg; }
  .pre1  { --rot:60deg; }  .pre2  { --rot:190deg; }
  /* 着水直後のさざ波（メルト前に2発） */
  .play .pre1 { animation:prepulse .55s ease-out 1.62s forwards; }
  .play .pre2 { animation:prepulse .6s ease-out 1.84s forwards; }
  @keyframes prepulse {
    0%   { opacity:1;  transform:translate(-50%,-50%) rotate(var(--rot)) scale(.10); }
    100% { opacity:0;  transform:translate(-50%,-50%) rotate(var(--rot)) scale(.72); }
  }
  .play .soup { animation:soupin .55s cubic-bezier(.2,.9,.3,1) 1.58s forwards; }
  @keyframes soupin {
    0%   { transform:translate(-50%,-50%) scale(0); opacity:0; }
    35%  { opacity:1; }
    100% { transform:translate(-50%,-50%) scale(1); opacity:1; }
  }

  /* --- 3.5 雫（上から落ちて着水） --- */
  .drop { position:absolute; left:50%; top:-8%; width:20px; height:30px; z-index:9;
    transform:translateX(-50%); opacity:0;
    border-radius:46% 54% 50% 50% / 30% 30% 70% 70%;
    background:
      radial-gradient(38% 26% at 34% 22%, rgba(255,246,220,.95), rgba(255,246,220,0) 70%),
      radial-gradient(20% 14% at 66% 60%, rgba(255,220,160,.5), rgba(255,220,160,0) 75%),
      radial-gradient(80% 80% at 50% 46%, #a35415 0%, #6f3208 62%, #4a1f05 100%);
    box-shadow:0 0 10px rgba(230,160,70,.35), inset 0 -3px 6px rgba(30,10,0,.5);
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.4)); }
  /* 落下中の尾引き */
  .drop::after { content:""; position:absolute; left:50%; top:-120%; width:3px; height:130%;
    transform:translateX(-50%); border-radius:2px;
    background:linear-gradient(180deg, rgba(163,84,21,0), rgba(200,120,50,.55)); }
  .play .drop { animation:dropfall .42s cubic-bezier(.55,0,1,.5) 1.18s forwards; }
  @keyframes dropfall {
    0%   { opacity:0; top:-8%; transform:translateX(-50%) scaleY(1); }
    15%  { opacity:1; }
    80%  { transform:translateX(-50%) scaleY(1.35) scaleX(.85); }
    100% { opacity:0; top:calc(52% - 12px); transform:translateX(-50%) scaleY(.6) scaleX(1.3); }
  }
  .splash { position:absolute; left:50%; top:52%; width:90px; height:90px; z-index:9;
    border-radius:50%; transform:translate(-50%,-50%) scale(0); opacity:0;
    background:radial-gradient(closest-side, rgba(255,226,150,.85), rgba(255,226,150,0) 70%); }
  .play .splash { animation:splashout .3s ease-out 1.56s forwards; }
  @keyframes splashout {
    0%   { opacity:.95; transform:translate(-50%,-50%) scale(.2); }
    100% { opacity:0;   transform:translate(-50%,-50%) scale(1.7); }
  }
  /* 波紋に合わせて文字が金縁に */
  .play .kanji { animation:goldrim .8s ease 1.5s forwards; }
  @keyframes goldrim {
    to { text-shadow:0 0 14px rgba(255,255,255,.18), 0 2px 26px rgba(212,162,78,.65), 0 0 60px rgba(212,162,78,.3); }
  }

  /* --- 4. 溶けてFVへ --- */
  .play.melt .kanji { animation:meltup .6s ease forwards; }
  .play.melt .band  { animation:meltup .55s ease .05s forwards; }
  @keyframes meltup { to { opacity:0; filter:blur(16px); transform:translateY(-80px); } }
  /* 波紋＝着水点から円形にFVが開いていく */
  .play.melt .fv { opacity:1; z-index:12;
    clip-path:circle(0% at 50% 52%);
    animation:fvopen 1.2s linear forwards; }
  @keyframes fvopen {
    0%   { clip-path:circle(0% at 50% 52%);   transform:scale(1.04); }
    100% { clip-path:circle(115% at 50% 52%); transform:scale(1); }
  }
  /* 波紋はリビールの縁に乗って最後まで走る（等速・終端=画面端） */
  .play.melt .ring  { animation:ringspread 1.2s linear forwards; }
  .play.melt .ring2 { animation:ringspread 1.2s linear .16s forwards; }
  .play.melt .ring3 { animation:ringspread 1.2s linear .32s forwards; }
  @keyframes ringspread {
    0%   { opacity:1; transform:translate(-50%,-50%) rotate(var(--rot)) scale(.22); }
    85%  { opacity:1; }
    100% { opacity:0; transform:translate(-50%,-50%) rotate(calc(var(--rot) + 12deg)) scale(5.0); }
  }
  @keyframes fade { to { opacity:0; } }

  .steam { position:absolute; bottom:-16%; width:46%; aspect-ratio:1/1.6; border-radius:50%;
    background:radial-gradient(closest-side, rgba(255,250,238,.34), rgba(255,250,238,0) 70%);
    filter:blur(24px); opacity:0; z-index:9; pointer-events:none; }
  .s1{left:6%;} .s2{left:30%; width:54%;} .s3{right:2%;}
  .play.melt .steam { animation:rise 1.3s ease-out forwards; }
  .play.melt .s2{animation-delay:.1s;} .play.melt .s3{animation-delay:.2s;}
  @keyframes rise {
    0%{opacity:0; transform:translateY(8%) scaleY(1);}
    30%{opacity:.85;}
    100%{opacity:0; transform:translateY(-125%) scaleY(1.45);}
  }

  .ui { position:fixed; right:12px; bottom:12px; z-index:20; }
  .ui button { background:#e8820c; color:#fff; border:none; border-radius:6px; padding:9px 16px; font-size:14px; }
  .cap { position:fixed; left:12px; bottom:12px; z-index:20; color:#9a8c74; font-size:12px; font-family:sans-serif; }

  /* FVアニメ内のスクロールは殺してページ側でスクロールさせる */
  .fvstage .fv { overflow:hidden; }

  /* ===== スクロール後の固定ヘッダー ===== */
  .header { position:fixed; top:0; left:50%; transform:translateX(-50%) translateY(-110%); width:100%; max-width:430px; z-index:100; background:#140b05; opacity:0; pointer-events:none; transition:transform .3s ease,opacity .3s ease; }
  .header.is-visible { transform:translateX(-50%) translateY(0); opacity:1; pointer-events:auto; }
  .header__img { display:block; width:100%; }
  .navbtn { position:absolute; top:0; bottom:0; right:0; width:22%; padding:0; background:none; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .navbtn:active { background:rgba(216,178,106,.14); }

  .part { position:relative; }
  .lp { display:block; width:100%; vertical-align:bottom; margin-bottom:-0.5px; }
  .anchor { position:absolute; left:0; width:1px; height:1px; scroll-margin-top:calc(min(100vw,430px)*0.1333); }

  /* ===== 下部追従バー ===== */
  .fixbar { position:fixed; bottom:0; left:50%; width:100%; max-width:430px; z-index:150; background:#1a1007; padding-bottom:env(safe-area-inset-bottom); transform:translateX(-50%) translateY(110%); opacity:0; pointer-events:none; transition:transform .32s ease,opacity .32s ease; }
  .fixbar.is-visible { transform:translateX(-50%) translateY(0); opacity:1; pointer-events:auto; }
  body.is-locked .fixbar { transform:translateX(-50%) translateY(110%); opacity:0; pointer-events:none; }
  .fixbar__inner { position:relative; }
  .fixbar__img { display:block; width:100%; }
  .fixbar__btn { position:absolute; top:0; bottom:0; width:33.333%; padding:0; background:none; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent; text-indent:-9999px; overflow:hidden; }
  .fixbar__btn--map{left:0;} .fixbar__btn--tel{left:33.333%;} .fixbar__btn--menu{left:66.666%;}
  .fixbar__btn:active { background:rgba(216,178,106,.14); }
  .footer-spacer { width:100%; height:calc(min(100vw,430px)*0.147 + env(safe-area-inset-bottom)); }

  /* ===== グローバルナビ ===== */
  .gnav { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.92); overflow-y:auto; -webkit-overflow-scrolling:touch; opacity:0; visibility:hidden; transition:opacity .28s ease; }
  .gnav.is-open { opacity:1; visibility:visible; }
  .gnav__inner { position:relative; max-width:430px; margin:0 auto; transform:translateY(-12px); transition:transform .32s ease; }
  .gnav.is-open .gnav__inner { transform:translateY(0); }
  .gnav__img { display:block; width:100%; }
  .gnav__row { position:absolute; left:0; width:100%; display:block; -webkit-tap-highlight-color:transparent; }
  .gnav__row:active { background:rgba(216,178,106,.16); }
  .gnav__close { position:absolute; top:2%; right:3%; width:16%; height:9%; background:none; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
</style>

  timers.push(setTimeout(()=>stage.classList.add('done'), 3150));
}
document.getElementById('ov').addEventListener('click', ()=>{ clearTimers(); stage.classList.add('play','melt','done'); });
replay();

  })();

  // ---- ナビ / ヘッダー / 追従バー ----
  var gnav=document.getElementById('gnav'),
      openBtns=[document.getElementById('navOpen'),document.getElementById('navOpenBar')],
      close=document.getElementById('navClose'),
      hdrBtn=document.getElementById('navOpen');
  function openNav(){ gnav.classList.add('is-open'); document.body.classList.add('is-locked'); hdrBtn.setAttribute('aria-expanded','true'); }
  function closeNav(){ gnav.classList.remove('is-open'); document.body.classList.remove('is-locked'); hdrBtn.setAttribute('aria-expanded','false'); }
  openBtns.forEach(function(b){ if(b) b.addEventListener('click',openNav); });
  close.addEventListener('click',closeNav);
  Array.prototype.forEach.call(document.querySelectorAll('.gnav__row'),function(a){ a.addEventListener('click',closeNav); });
  gnav.addEventListener('click',function(e){ if(e.target===gnav) closeNav(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeNav(); });

  var header=document.getElementById('header'), fixbar=document.getElementById('fixbar'),
      fvEnd=document.getElementById('fvEnd'), ticking=false;
  function update(){
    var passed=fvEnd.getBoundingClientRect().top<=0;
    header.classList.toggle('is-visible',passed);
    fixbar.classList.toggle('is-visible',passed);
    ticking=false;
  }
  window.addEventListener('scroll',function(){ if(!ticking){ ticking=true; requestAnimationFrame(update); } },{passive:true});
  window.addEventListener('resize',update); window.addEventListener('load',update); update();
</script>
